name: Code Quality PR

on:
  pull_request:
    branches: [main, "release/*", "dev"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  code-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python 3.12.3
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.3"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.7.9"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
            .pre-commit-config.yaml
            .github/workflows/*.yml
            scripts/*.sh

      - name: Find modified files
        id: file_changes
        shell: bash
        run: |
          mapfile -t changed_files < <(
            git diff --name-only --diff-filter=ACMRT \
              "${{ github.event.pull_request.base.sha }}" \
              "${{ github.event.pull_request.head.sha }}"
          )

          if [ "${#changed_files[@]}" -eq 0 ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          {
            echo "files<<EOF"
            printf '%s\n' "${changed_files[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Print modified files
        if: ${{ steps.file_changes.outputs.has_changes == 'true' }}
        run: |
          printf '%s\n' "${{ steps.file_changes.outputs.files }}"

      - name: Run repository quality gate
        if: ${{ steps.file_changes.outputs.has_changes == 'true' }}
        shell: bash
        run: |
          mapfile -t changed_files <<< "${{ steps.file_changes.outputs.files }}"
          bash scripts/ci_quality.sh "${changed_files[@]}"

      - name: Skip cleanly when no tracked files changed
        if: ${{ steps.file_changes.outputs.has_changes != 'true' }}
        run: bash scripts/ci_quality.sh __ci_no_files__

      - name: Upload code-quality logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: code-quality-pr-${{ github.run_id }}
          path: tmp/github-actions/code-quality
          if-no-files-found: error
          retention-days: 5
