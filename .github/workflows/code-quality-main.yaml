name: Code Quality Main

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python 3.12.3
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.3"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.7.9"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
            .pre-commit-config.yaml
            .github/workflows/*.yml
            scripts/*.sh

      - name: Run repository quality gate
        run: bash scripts/ci_quality.sh

      - name: Upload code-quality logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: code-quality-main-${{ github.run_id }}
          path: tmp/github-actions/code-quality
          if-no-files-found: error
          retention-days: 5
