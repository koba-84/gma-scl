defaults:
  - default
  - /contrastive/model/agg@loss_fn: BERTScore_F1

loss_fn:
  _target_: src.models.loss.gma_scl.GMASCL
  data_dir: ${contrastive.data.data_dir}
  instance_temperature: 0.1
  graph_temperature: 0.1
  rank_temperature: 0.1
  lambda_rank: 0.5
  dataset_name: ${contrastive.data.dataset_name}
  sbert_model_name: sentence-transformers/all-MiniLM-L6-v2
  sbert_max_length: 512
  whitening: false
