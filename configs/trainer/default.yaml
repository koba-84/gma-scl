_target_: lightning.pytorch.trainer.Trainer

default_root_dir: ${paths.output_dir}

min_epochs: 1 # prevents early stopping
max_epochs: 10

accelerator: cpu
devices: 1
strategy: auto

# mixed precision for extra speed-up
precision: bf16-mixed

# perform a validation loop every N training epochs
check_val_every_n_epoch: 1

# stepログ間隔を1にして警告を回避（メトリクス自体はon_epochでエポック単位）
log_every_n_steps: 1

# set True to ensure fully reproducible default runs
# makes training slower but aligns the default path with the repo reproducibility policy
deterministic: True
